apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels: { app: zookeeper }
spec:
  clusterIP: None
  ports:
    - name: client
      port: 2181
  selector: { app: zookeeper }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels: { app: zookeeper }
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels: { app: zookeeper }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      securityContext:
        fsGroup: 1001          # debezium 이미지 실행 유저(kafka) 그룹
      containers:
        - name: zookeeper
          image: debezium/zookeeper:1.4
          env:
            - { name: JMXHOST, value: "0.0.0.0" }
            - { name: JMXPORT, value: "9010" }
          ports:
            - { name: client, containerPort: 2181 }
            - { name: jmx, containerPort: 9010 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /zookeeper/data, subPath: data }
            - { name: data, mountPath: /zookeeper/txns, subPath: txns }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
