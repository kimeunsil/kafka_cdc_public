# 모든 클러스터 공통 커넥터 기본값 (registrar 가 sinks.yaml, 클러스터별 sources.yaml 과 병합)
defaults:
  source:
    connector.class: io.debezium.connector.mysql.MySqlConnector
    tasks.max: 1
    database.port: 3306
    database.user: debezium
    database.password: ${file:/secrets/mysql/mysql.properties:password}
    database.history.kafka.bootstrap.servers: kafka:9092
    database.history.store.only.monitored.tables.ddl: true
    database.history.skip.unparseable.ddl: true
    database.history.kafka.recovery.poll.interval.ms: 50
    database.history.kafka.recovery.attempts: 10
    include.schema.changes: true
    snapshot.mode: initial
    snapshot.locking.mode: none
    min.row.count.to.stream.results: 0
    connect.timeout.ms: 30000
    event.processing.failure.handling.mode: warn
    inconsistent.schema.handling.mode: warn
    errors.tolerance: all
    errors.log.enable: true
    errors.log.include.messages: true
    errors.retry.delay.max.ms: 60000
    errors.retry.timeout: 300000
    # server.db.table → table  (토픽명 = 테이블명)
    transforms: route
    transforms.route.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.route.regex: '([^.]+)\.([^.]+)\.([^.]+)'
    transforms.route.replacement: '$3'

  sink:
    connector.class: com.wepay.kafka.connect.bigquery.BigQuerySinkConnector
    tasks.max: 1
    sanitizeTopics: true
    autoCreateTables: true
    autoUpdateSchemas: true
    schemaRetriever: com.wepay.kafka.connect.bigquery.schemaregistry.schemaretriever.SchemaRegistrySchemaRetriever
    schemaRegistryLocation: http://schema-registry:8081
    bufferSize: 100000
    maxWriteSize: 10000
    tableWriteWait: 1000
    project: ${env:GCP_PROJECT}
    keyfile: /secrets/gcp/credentials.json
