apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cdc
resources:
  - ../../base

configMapGenerator:
  - name: connectors
    behavior: merge
    files:
      - sources.yaml=connectors.yaml
  - name: cdc-env
    literals:
      - CLUSTER_NAME=cdc-cluster-b
      - GCP_PROJECT=your-gcp-project-id
      - BQ_DATASET=cdc_stream
